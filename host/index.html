<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>p5inBlender — sketch host</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c10;color:#c9c9d4;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  #hud{padding:6px 12px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #22232d;background:#101218;flex-wrap:wrap}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
  canvas{max-width:100%;max-height:100%;image-rendering:pixelated;box-shadow:0 0 0 1px #232533}
  .bad{color:#f88}
  .good{color:#8f8}
  .warn{color:#fc8}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>p5inBlender</span>
    <span id="ws">ws: …</span>
    <span id="p5">p5: …</span>
    <span id="ver">sketch: –</span>
    <span id="fps">fps: –</span>
    <span id="objs">objects: –</span>
  </div>
  <div id="stage"><div id="mount"></div></div>
</div>
<script>
const mount = document.getElementById('mount');
const $ = (id) => document.getElementById(id);
const hud = { ws: $('ws'), p5: $('p5'), ver: $('ver'), fps: $('fps'), objs: $('objs') };

let ws = null;
let p5Ready = false;
let p5Instance = null;
let placeholder = null;      // canvas used when p5 is unavailable
let lastState = { objects: [], frame: 0, t: 0 };
let sent = 0, sentT0 = performance.now(), lastSource = '';

// ------------------------------------------------------------- p5.js loader
// 顺序：插件自带的 host/p5.min.js → CDN → 失败
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('failed: ' + src));
    document.head.appendChild(s);
  });
}

async function ensureP5() {
  const candidates = ['/p5.min.js', 'https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js'];
  for (const src of candidates) {
    try {
      await loadScript(src);
      if (window.p5) {
        p5Ready = true;
        hud.p5.textContent = 'p5: ' + (window.p5.VERSION || 'ok');
        hud.p5.className = 'good';
        return true;
      }
    } catch (e) { /* try next */ }
  }
  p5Ready = false;
  hud.p5.textContent = 'p5: 未加载';
  hud.p5.className = 'bad';
  return false;
}

// ---------------------------------------------------------------- transport
function connect() {
  ws = new WebSocket(`ws://${location.host}/`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    hud.ws.textContent = 'ws: connected'; hud.ws.className = 'good';
    ws.send(JSON.stringify({ type: 'ready', p5: p5Ready, ua: navigator.userAgent }));
    ws.send(JSON.stringify({ type: 'want_sketch' }));
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') return;
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'sketch') loadSketch(msg.source, msg.version);
    else if (msg.type === 'state') {
      lastState = msg;
      hud.objs.textContent = `objects: ${(msg.objects || []).length}`;
      // 实例的分辨率变了就跟着调整画布
      if (p5Instance && msg.w && msg.h &&
          (p5Instance.width !== msg.w || p5Instance.height !== msg.h)) {
        try { p5Instance.resizeCanvas(msg.w, msg.h); } catch (e) { console.error(e); }
      }
    } else if (msg.type === 'cook') {
      if (msg.state) lastState = msg.state;
      pushStateToSketch(msg.t || 0);
      if (p5Instance) {
        try { p5Instance.redraw(); } catch (e) { console.error(e); }
        sendFrame(msg.id, p5Instance.canvas);
      } else {
        drawPlaceholder();
        sendFrame(msg.id, placeholder);
      }
    }
  };
  ws.onclose = () => {
    hud.ws.textContent = 'ws: closed, retrying…'; hud.ws.className = 'bad';
    setTimeout(connect, 700);
  };
  ws.onerror = () => { hud.ws.textContent = 'ws: error'; hud.ws.className = 'bad'; };
}

// v2 帧：header + plane 表 + 负载
function buildFrame(cv, seq, req) {
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, cv.width, cv.height);
  const planes = [{ name: 'rgba', channels: 4, data: new Uint8Array(img.data.buffer) }];
  const hdrLen = 24 + planes.length * 9;
  const total = planes.reduce((a, p) => a + p.data.length, 0);
  const out = new Uint8Array(hdrLen + total);
  const dv = new DataView(out.buffer);
  out.set([0x50, 0x35, 0x42, 0x32], 0);            // "P5B2"
  dv.setUint32(4, cv.width, true);
  dv.setUint32(8, cv.height, true);
  dv.setUint32(12, seq, true);
  dv.setUint32(16, req, true);
  dv.setUint16(20, planes.length, true);
  dv.setUint16(22, 0, true);
  let off = 24;
  for (const p of planes) {
    for (let i = 0; i < 4; i++) out[off + i] = p.name.charCodeAt(i) || 0;
    off += 4; out[off] = p.channels; off += 1;
    dv.setUint32(off, p.data.length, true); off += 4;
  }
  for (const p of planes) { out.set(p.data, off); off += p.data.length; }
  return out;
}

function sendFrame(req, cv) {
  if (!cv || !cv.width) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (ws.bufferedAmount > 4 * 1024 * 1024) return;      // 背压：宁可丢帧
  ws.send(buildFrame(cv, sent++, req || 0));
  const now = performance.now();
  if (now - sentT0 > 500) {
    hud.fps.textContent = `fps: ${(sent * 1000 / (now - sentT0)).toFixed(1)}`;
    sent = 0; sentT0 = now;
  }
}

// ------------------------------------------------------------------- sketch
function pushStateToSketch(t) {
  if (!p5Instance) return;
  p5Instance.p5inblender = {
    state: lastState,
    t: t,
    frame: lastState.frame || 0,
    w: lastState.w || p5Instance.width,
    h: lastState.h || p5Instance.height,
  };
}

function destroySketch() {
  if (p5Instance) {
    try { p5Instance.remove(); } catch (e) { /* ignore */ }
    p5Instance = null;
  }
  mount.innerHTML = '';
  placeholder = null;
}

function makePlaceholder(w, h) {
  mount.innerHTML = '';
  placeholder = document.createElement('canvas');
  placeholder.width = w; placeholder.height = h;
  mount.appendChild(placeholder);
  drawPlaceholder();
  return placeholder;
}

function drawPlaceholder() {
  if (!placeholder) return;
  const ctx = placeholder.getContext('2d');
  ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, placeholder.width, placeholder.height);
  ctx.fillStyle = '#ff7b7b'; ctx.font = '15px ui-monospace, monospace';
  ctx.fillText('p5.js 未加载', 20, 42);
  ctx.fillStyle = '#8a93a6'; ctx.font = '13px ui-monospace, monospace';
  ctx.fillText('把 p5.min.js 放进插件的 host/ 目录（或连网），然后刷新本页', 20, 70);
  ctx.fillText(`server: ${location.host}`, 20, 92);
}

function loadSketch(source, ver) {
  hud.ver.textContent = `sketch: v${ver}`;
  lastSource = source;
  destroySketch();
  if (!p5Ready) {
    makePlaceholder(640, 360);
    return;
  }
  try {
    // 源码里必须定义 function sketch(p) { ... }
    const factory = new Function(
      source + '\n;return typeof sketch === "function" ? sketch : null;',
    );
    const fn = factory();
    if (!fn) throw new Error('没有找到 function sketch(p)');
    p5Instance = new p5((p) => {
      p.p5inblender = { state: lastState, t: 0, frame: 0 };
      fn(p);
    }, mount);
  } catch (err) {
    console.error(err);
    makePlaceholder(640, 360);
    const ctx = placeholder.getContext('2d');
    ctx.fillStyle = '#1a0d10'; ctx.fillRect(0, 0, placeholder.width, placeholder.height);
    ctx.fillStyle = '#ff7b7b'; ctx.font = '14px ui-monospace, monospace';
    ctx.fillText('sketch 出错：', 20, 40);
    ctx.fillText(String((err && err.message) || err).slice(0, 110), 20, 66);
  }
}

// ----------------------------------------------------------------- main loop
function tick() {
  if (p5Instance) {
    pushStateToSketch(lastState.t || 0);
    sendFrame(0, p5Instance.canvas);
  } else if (placeholder) {
    sendFrame(0, placeholder);
  }
  requestAnimationFrame(tick);
}

// 浏览器被遮挡时 rAF 会停，用定时器兜底
setInterval(() => {
  if (document.hidden) tick();
}, 100);

(document.hidden ? Promise.resolve() : Promise.resolve())
  .then(ensureP5)
  .then(() => {
    connect();
    requestAnimationFrame(tick);
  });
</script>
</body>
</html>
