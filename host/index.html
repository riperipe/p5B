<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>p5inBlender — sketch host</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c10;color:#c9c9d4;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  #hud{padding:6px 12px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #22232d;background:#101218;flex-wrap:wrap}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
  canvas{max-width:100%;max-height:100%;image-rendering:pixelated;box-shadow:0 0 0 1px #232533}
  .bad{color:#f88}
  .good{color:#8f8}
  .warn{color:#fc8}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>p5inBlender</span>
    <span id="ws">ws: …</span>
    <span id="p5">p5: …</span>
    <span id="ver">sketch: –</span>
    <span id="libs">libs: –</span>
    <span id="fps">fps: –</span>
    <span id="objs">objects: –</span>
  </div>
  <div id="stage"><div id="mount"></div></div>
</div>
<script>
const mount = document.getElementById('mount');
const $ = (id) => document.getElementById(id);
const hud = { ws: $('ws'), p5: $('p5'), ver: $('ver'), libs: $('libs'), fps: $('fps'), objs: $('objs') };

let ws = null;
let p5Ready = false;
let p5Instance = null;
let iframe = null;           // global-mode sketches run inside an iframe
let iframeCanvas = null;     // 2D scratch holding the iframe's latest frame
let sketchMode = 'instance';
let pendingSketch = null;
let placeholder = null;      // canvas used when p5 is unavailable
let lastState = { objects: [], frame: 0, t: 0 };
let texCanvas = null;        // upstream texture coming from Blender (P5BT packets)
let sent = 0, sentT0 = performance.now(), lastSource = '';

// ------------------------------------------------------------- p5.js loader
// 顺序：插件自带的 host/p5.min.js → CDN → 失败
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('failed: ' + src));
    document.head.appendChild(s);
  });
}

async function ensureP5() {
  const candidates = ['/p5.min.js', 'https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js'];
  for (const src of candidates) {
    try {
      await loadScript(src);
      if (window.p5) {
        p5Ready = true;
        hud.p5.textContent = 'p5: ' + (window.p5.VERSION || 'ok');
        hud.p5.className = 'good';
        return true;
      }
    } catch (e) { /* try next */ }
  }
  p5Ready = false;
  hud.p5.textContent = 'p5: 未加载';
  hud.p5.className = 'bad';
  return false;
}

// ------------------------------------------------------------ upstream texture
// Blender -> browser: "P5BT" | w u32 | h u32 | len u32 | RGBA8 (top-down)
function onTexture(buf) {
  const bytes = new Uint8Array(buf, 0, 4);
  if (bytes[0] !== 0x50 || bytes[1] !== 0x35 || bytes[2] !== 0x42 || bytes[3] !== 0x54) return;
  const dv = new DataView(buf);
  const w = dv.getUint32(4, true), h = dv.getUint32(8, true), len = dv.getUint32(12, true);
  if (!w || !h || len !== w * h * 4) return;
  if (!texCanvas || texCanvas.width !== w || texCanvas.height !== h) {
    texCanvas = document.createElement('canvas');
    texCanvas.width = w; texCanvas.height = h;
  }
  const ctx = texCanvas.getContext('2d');
  const data = new Uint8ClampedArray(buf, 16, len);
  ctx.putImageData(new ImageData(data, w, h), 0, 0);
  if (p5Instance) p5Instance.p5inblender.texture = texCanvas;
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'texture_ack' }));
}

// ---------------------------------------------------------------- transport
function connect() {
  ws = new WebSocket(`ws://${location.host}/`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    hud.ws.textContent = 'ws: connected'; hud.ws.className = 'good';
    ws.send(JSON.stringify({ type: 'ready', p5: p5Ready, ua: navigator.userAgent }));
    ws.send(JSON.stringify({ type: 'want_sketch' }));
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') { onTexture(ev.data); return; }
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'sketch') loadSketch(msg.source, msg.version);
    else if (msg.type === 'state') {
      lastState = msg;
      hud.objs.textContent = `objects: ${(msg.objects || []).length}`;
      // 实例的分辨率变了就跟着调整画布
      if (p5Instance && msg.w && msg.h &&
          (p5Instance.width !== msg.w || p5Instance.height !== msg.h)) {
        try { p5Instance.resizeCanvas(msg.w, msg.h); } catch (e) { console.error(e); }
      }
    } else if (msg.type === 'cook') {
      if (msg.state) lastState = msg.state;
      pushStateToSketch(msg.t || 0);
      if (iframe) {
        try { iframe.contentWindow.redraw && iframe.contentWindow.redraw(); } catch (e) { /* ignore */ }
        captureFromIframe();
        sendFrame(msg.id, activeCanvas());
      } else if (p5Instance) {
        try { p5Instance.redraw(); } catch (e) { console.error(e); }
        sendFrame(msg.id, p5Instance.canvas);
      } else {
        drawPlaceholder();
        sendFrame(msg.id, placeholder);
      }
    }
  };
  ws.onclose = () => {
    hud.ws.textContent = 'ws: closed, retrying…'; hud.ws.className = 'bad';
    setTimeout(connect, 700);
  };
  ws.onerror = () => { hud.ws.textContent = 'ws: error'; hud.ws.className = 'bad'; };
}

// v2 帧：header + plane 表 + 负载
// 源画布可能是 WebGL（getContext('2d') 直接返回 null），统一先 blit 到 2D 暂存画布
let scratch2d = null;

function readable2d(cv) {
  if (!scratch2d) scratch2d = document.createElement('canvas');
  if (scratch2d.width !== cv.width) scratch2d.width = cv.width;
  if (scratch2d.height !== cv.height) scratch2d.height = cv.height;
  const ctx = scratch2d.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, scratch2d.width, scratch2d.height);
  try { ctx.drawImage(cv, 0, 0); } catch (e) { /* ignore */ }
  return scratch2d;
}

function buildFrame(cv, seq, req) {
  const src = readable2d(cv);
  const ctx = src.getContext('2d', { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, src.width, src.height);
  cv = src;
  const planes = [{ name: 'rgba', channels: 4, data: new Uint8Array(img.data.buffer) }];
  const hdrLen = 24 + planes.length * 9;
  const total = planes.reduce((a, p) => a + p.data.length, 0);
  const out = new Uint8Array(hdrLen + total);
  const dv = new DataView(out.buffer);
  out.set([0x50, 0x35, 0x42, 0x32], 0);            // "P5B2"
  dv.setUint32(4, cv.width, true);
  dv.setUint32(8, cv.height, true);
  dv.setUint32(12, seq, true);
  dv.setUint32(16, req, true);
  dv.setUint16(20, planes.length, true);
  dv.setUint16(22, 0, true);
  let off = 24;
  for (const p of planes) {
    for (let i = 0; i < 4; i++) out[off + i] = p.name.charCodeAt(i) || 0;
    off += 4; out[off] = p.channels; off += 1;
    dv.setUint32(off, p.data.length, true); off += 4;
  }
  for (const p of planes) { out.set(p.data, off); off += p.data.length; }
  return out;
}

function sendFrame(req, cv) {
  if (!cv || !cv.width) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (ws.bufferedAmount > 4 * 1024 * 1024) return;      // 背压：宁可丢帧
  ws.send(buildFrame(cv, sent++, req || 0));
  const now = performance.now();
  if (now - sentT0 > 500) {
    hud.fps.textContent = `fps: ${(sent * 1000 / (now - sentT0)).toFixed(1)}`;
    sent = 0; sentT0 = now;
  }
}

// --------------------------------------------------------------- sketch libs
// `// @lib <url>` 行会在 sketch 运行前被加载（同一 URL 只加载一次）
const loadedLibs = new Set();

function extractLibs(source) {
  const out = [];
  for (const line of source.split('\n')) {
    const m = line.match(/^\s*\/\/\s*@lib\s+(\S+)/);
    if (m) out.push(m[1]);
  }
  return out;
}

async function loadLibs(urls) {
  for (const url of urls) {
    if (loadedLibs.has(url)) continue;
    try {
      await loadScript(url);
      loadedLibs.add(url);
    } catch (err) {
      console.error('lib failed', url, err);
    }
  }
}

// ------------------------------------------------------------------- sketch
let sketchToken = 0;
function pushStateToSketch(t) {
  const payload = {
    state: lastState,
    t: t,
    frame: lastState.frame || 0,
    w: lastState.w || (p5Instance ? p5Instance.width : 640),
    h: lastState.h || (p5Instance ? p5Instance.height : 360),
    texture: texCanvas,
  };
  if (iframe) { setGlobalState(payload); return; }
  if (!p5Instance) return;
  p5Instance.p5inblender = payload;
}

function destroySketch() {
  if (p5Instance) {
    try { p5Instance.remove(); } catch (e) { /* ignore */ }
    p5Instance = null;
  }
  if (iframe) {
    try { iframe.remove(); } catch (e) { /* ignore */ }
    iframe = null;
  }
  iframeCanvas = null;      // 别让旧 iframe 的帧继续被当成当前画面
  mount.innerHTML = '';
  placeholder = null;
}

// 全局模式：把 p5 和 sketch 放进同源 iframe，让老 sketch 不用改就能跑
function runGlobalSketch(source, libs) {
  sketchMode = 'global';
  iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:100%;height:100%;border:0;background:#000';
  mount.appendChild(iframe);
  const doc = iframe.contentDocument;
  const libTags = libs.map((u) => '<script src="' + u + '"><\/script>').join('');
  doc.open();
  doc.write('<!doctype html><html><head><style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style>' +
            '<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"><\/script>' + libTags +
            '</head><body></body></html>');
  doc.close();
  const boot = () => {
    if (!iframe) return;
    const win = iframe.contentWindow;
    if (!win || !win.p5) { setTimeout(boot, 60); return; }
    // 把 iframe 里的报错转发出来（全局模式没有我们的 try/catch 包着）
    try {
      const relay = (msg) => {
        const text = String(msg).slice(0, 300);
        console.error('[sketch]', text);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'sketch_error', msg: text }));
        }
      };
      win.onerror = (m, s, l) => { relay(m + '  @line ' + l); return false; };
      const origError = win.console.error;
      win.console.error = function () {
        relay(Array.prototype.slice.call(arguments).join(' '));
        return origError.apply(win.console, arguments);
      };
    } catch (e) { /* ignore */ }
    const tag = iframe.contentDocument.createElement('script');
    tag.textContent = source;
    iframe.contentDocument.body.appendChild(tag);
    wrapIframeDraw();
  };
  boot();
}

// WebGL 画布不能直接 getImageData；把 draw 包一层，在同一次调用里 blit 到 2D 画布
function captureFromIframe() {
  if (!iframe) return;
  let cv = null;
  try { cv = iframe.contentDocument.querySelector('canvas'); } catch (e) { return; }
  if (!cv || !cv.width || !cv.height) return;
  if (!iframeCanvas || iframeCanvas.width !== cv.width || iframeCanvas.height !== cv.height) {
    iframeCanvas = document.createElement('canvas');
    iframeCanvas.width = cv.width;
    iframeCanvas.height = cv.height;
  }
  const ctx = iframeCanvas.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, iframeCanvas.width, iframeCanvas.height);
  try { ctx.drawImage(cv, 0, 0); } catch (e) { /* ignore */ }
}

function wrapIframeDraw() {
  if (!iframe) return;
  const win = iframe.contentWindow;
  if (!win || typeof win.draw !== 'function' || win.__p5bWrapped) {
    setTimeout(wrapIframeDraw, 120);
    return;
  }
  win.__p5bWrapped = true;
  const orig = win.draw;
  win.draw = function () {
    const r = orig.apply(this, arguments);
    captureFromIframe();
    return r;
  };
}

function activeCanvas() {
  if (iframe) {
    if (iframeCanvas && iframeCanvas.width) return iframeCanvas;
    try {
      const doc = iframe.contentDocument;
      if (doc) return doc.querySelector('canvas');
    } catch (e) { /* ignore */ }
    return null;
  }
  return p5Instance ? p5Instance.canvas : placeholder;
}

function globalState() {
  if (!iframe) return null;
  try { return iframe.contentWindow.p5inblender; } catch (e) { return null; }
}

function setGlobalState(obj) {
  if (!iframe) return;
  try { iframe.contentWindow.p5inblender = obj; } catch (e) { /* ignore */ }
}

function makePlaceholder(w, h) {
  mount.innerHTML = '';
  placeholder = document.createElement('canvas');
  placeholder.width = w; placeholder.height = h;
  mount.appendChild(placeholder);
  drawPlaceholder();
  return placeholder;
}

function drawPlaceholder() {
  if (!placeholder) return;
  const ctx = placeholder.getContext('2d');
  ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, placeholder.width, placeholder.height);
  ctx.fillStyle = '#ff7b7b'; ctx.font = '15px ui-monospace, monospace';
  ctx.fillText('p5.js 未加载', 20, 42);
  ctx.fillStyle = '#8a93a6'; ctx.font = '13px ui-monospace, monospace';
  ctx.fillText('把 p5.min.js 放进插件的 host/ 目录（或连网），然后刷新本页', 20, 70);
  ctx.fillText(`server: ${location.host}`, 20, 92);
}

function loadSketch(source, ver) {
  hud.ver.textContent = `sketch: v${ver}`;
  lastSource = source;
  const token = ++sketchToken;
  destroySketch();
  if (!p5Ready) {
    pendingSketch = { source: source, ver: ver };
    makePlaceholder(640, 360);
    return;
  }
  const libs = extractLibs(source);
  hud.libs.textContent = libs.length ? `libs: ${libs.length}` : 'libs: –';
  const globalMode = /^\s*\/\/\s*@mode\s+global/m.test(source) ||
                     (!/function\s+sketch\s*\(/.test(source) && /function\s+setup\s*\(/.test(source));
  if (globalMode) {
    runGlobalSketch(source, libs);
    return;
  }
  sketchMode = 'instance';
  const start = () => {
    if (token !== sketchToken) return;
    try {
      // 源码里必须定义 function sketch(p) { ... }
      const factory = new Function(
        source + '\n;return typeof sketch === "function" ? sketch : null;',
      );
      const fn = factory();
      if (!fn) throw new Error('没有找到 function sketch(p)');
      p5Instance = new p5((p) => {
        p.p5inblender = { state: lastState, t: 0, frame: 0, texture: texCanvas };
        fn(p);
      }, mount);
    } catch (err) {
      console.error(err);
      makePlaceholder(640, 360);
      const ctx = placeholder.getContext('2d');
      ctx.fillStyle = '#1a0d10'; ctx.fillRect(0, 0, placeholder.width, placeholder.height);
      ctx.fillStyle = '#ff7b7b'; ctx.font = '14px ui-monospace, monospace';
      ctx.fillText('sketch 出错：', 20, 40);
      ctx.fillText(String((err && err.message) || err).slice(0, 110), 20, 66);
    }
  };
  if (libs.length) {
    loadLibs(libs).then(start);
  } else {
    start();
  }
}

// ----------------------------------------------------------------- main loop
function tick() {
  requestAnimationFrame(tick);        // 先排下一帧：出错也不会把循环打断
  try {
    if (iframe) {
      // 全局模式：同步重绘一帧，紧接着 blit（WebGL 缓冲只在本次调用内有效）
      try {
        const win = iframe.contentWindow;
        if (win && typeof win.redraw === 'function') win.redraw();
      } catch (e) { /* ignore */ }
      captureFromIframe();
    }
    const cv = activeCanvas();
    if (cv && cv.width) {
      pushStateToSketch(lastState.t || 0);
      sendFrame(0, cv);
    }
  } catch (err) {
    console.error(err);
  }
}

// 浏览器被遮挡时 rAF 会停，用定时器兜底
setInterval(() => {
  if (document.hidden) tick();
}, 100);

// 先连上，再后台准备 p5 —— 传输不该被库加载挡住
connect();
requestAnimationFrame(tick);

ensureP5().then(function (ok) {
  p5Ready = ok;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ready', p5: ok, ua: navigator.userAgent }));
  }
  if (pendingSketch) {
    const s = pendingSketch;
    pendingSketch = null;
    loadSketch(s.source, s.ver);
  }
});
</script>
</body>
</html>
